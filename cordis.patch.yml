# dsh-test-mode — 测试模式插件。
#
# Host 半:注册 `/dsh-test-mode` 前缀路由(静态 + JSON API),提供测试引擎
# (动态插件装载 → 快照 → 场景断言 → 清理断言)、用例/接口/计划/报告数据 API
# 与写盘校验 + 自动提交钩子。
#
# Client 半:由 package.json 的 `dsh.client` 声明,向 `conversation.view` 注册
# 7 个对话视图标签;标签可见性由会话头部的门控探针按当前会话的 `agentPreset`
# 投影决定(仅测试模式会话显示)。
#
# 测试模式预设以 `@deepseek-ai/dsh-agent-preset` 声明行发布:本行随插件包安装,
# 会话模式选择器即可选择「测试模式」。子行里的 `@calwang414/dsh-test-mode/preset`
# 与 `/skill` 由包自身 exports 解析,无需运行时写入用户目录。
- insert:
    - id: dsh-test-mode
      name: '@calwang414/dsh-test-mode'

    - id: preset-dsh-test-mode
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-test-mode
        name: 测试模式
        description: 面向测试工作流:在测试模式下编写并运行动态插件测试(装载→快照→场景断言→清理断言),管理测试用例与 API 测试,所有产物保存在共享的 test-mode/ 目录中。
        order: 6
        plugins:
          # ── identity ────────────────────────────────────────────────────
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a testing agent powered by the {{model}} model. You write
                and run dynamic-plugin tests, manage test cases, and exercise API
                requests, as real editable files in the shared test-mode/ project.
              suffix: Your working directory is {{cwd}}.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── testing workflow ────────────────────────────────────────────
          #
          # `preset` 注册测试工作流 system-prompt 段(含产物规范与生成自查);
          # `skill` 向本预设层注册 bundled 技能候选(仅测试模式会话可见)。

          - id: dsh-test-mode-workflow
            name: '@calwang414/dsh-test-mode/preset'

          - id: dsh-test-mode-workflow-skill
            name: '@calwang414/dsh-test-mode/skill'

          # ── shell ───────────────────────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── compaction ──────────────────────────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── remaining model-facing rows ─────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
